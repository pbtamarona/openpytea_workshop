name: test-notebooks

on:
  push:
  pull_request:

jobs:
  execute:
    name: Execute notebooks on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workshop environment
        run: |
          python -m pip install --upgrade pip
          pip install "openpytea[ipython]"
          pip install jupyterlab nbconvert

      - name: Smoke test OpenPyTEA import and CLI
        run: |
          python -c "import openpytea; print('OpenPyTEA', openpytea.__version__)"
          openpytea --help

      - name: Execute all notebooks
        shell: bash
        env:
          MPLBACKEND: Agg
          OPENPYTEA_WORKSHOP_CI: "1"
        run: |
          cd notebooks
          for nb in 0*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --ExecutePreprocessor.timeout=900 \
              --output-dir /tmp/executed || exit 1
            echo "::endgroup::"
          done
