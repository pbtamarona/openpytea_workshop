# Workshop environment for the OpenPyTEA hands-on session (conda / Miniforge route).
# From the repository root:
#   conda env create -f envs/environment.yml
#   conda activate openpytea-ws
name: openpytea-ws
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - ipywidgets>=8.0
  - numpy
  - pandas
  - scipy
  - matplotlib
  - tqdm
  - jinja2
  - pip:
      - openpytea>=3.0.0
